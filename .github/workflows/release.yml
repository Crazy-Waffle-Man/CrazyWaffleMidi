# I had a LLM generate this one because I'm not gonna learn all the documentation behind this 
# when my .jar is perfectly fine if you have Java installed.
# This file is not my job.

name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
            qt_arch: msvc2022_64
          - os: macos-14
            platform: macos
            qt_arch: clang_64
          - os: ubuntu-22.04
            platform: linux-x64
            qt_arch: gcc_64

    env:
      QT_VERSION: "6.12.0"
      QTJAMBI_VERSION: "6.12.0"
      QT_ROOT: ${{ github.workspace }}/Qt
      QT_DIR: ${{ github.workspace }}/Qt/6.12.0/${{ matrix.qt_arch }}
      QT_INSTALLER_JWT_TOKEN: ${{ secrets.QT_INSTALLER_JWT_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build fat JAR
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x ./gradlew
          ./gradlew :app:clean :app:shadowJar
          test -s app/build/libs/app-all.jar

      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not $env:QT_INSTALLER_JWT_TOKEN) {
            throw "Set the QT_INSTALLER_JWT_TOKEN repository secret."
          }

          $installer = "$env:RUNNER_TEMP\qt-installer.exe"
          Invoke-WebRequest `
            "https://download.qt.io/official_releases/online_installers/qt-online-installer-windows-x64-online.exe" `
            -OutFile $installer

          & $installer `
            --root "$env:QT_ROOT" `
            --accept-licenses `
            --accept-obligations `
            --default-answer `
            --confirm-command `
            install qt.qt6.6120.win64_msvc2022_64
          $version = $env:QTJAMBI_VERSION
          $out = "dist/CrazyWaffleMidi"

          $classpath = @(
            "$out\lib\app-all.jar"
            "$out\lib\qtjambi.jar"
            "$out\lib\qtjambi-native.jar"
            (Get-ChildItem "$out\lib\qt-lib-*.jar" |
              ForEach-Object { $_.FullName })
            ) -join ";"

          java "-Djava.library.path=$env:QT_DIR\bin" `
            -cp "tools/qtjambi.jar;tools/deployer.jar" `
            io.qt.qtjambi.deployer.Main app `
            --application=CrazyWaffleMidi `
            --executable=utilities/QtJambiLauncher.exe `
            "--class-path=$classpath" `
            --library-path=. `
            --jvm-path=../jre `
            --main-class=com.cwm.CrazyWaffleMidi.Main `
            --dir="$out\bin"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Install Qt (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$QT_INSTALLER_JWT_TOKEN"

          curl -fL \
          https://download.qt.io/official_releases/online_installers/qt-online-installer-macOS-universal.dmg \
          -o "$RUNNER_TEMP/qt-installer.dmg"

          mkdir -p "$RUNNER_TEMP/QtInstaller"
          hdiutil attach "$RUNNER_TEMP/qt-installer.dmg" \
            -nobrowse -quiet \
            -mountpoint "$RUNNER_TEMP/QtInstaller"

          installer="$(find "$RUNNER_TEMP/QtInstaller" \
            -type f -path '*/Contents/MacOS/*' -perm -111 \
            -print -quit)"
          test -n "$installer"

          "$installer" \
            --root "$QT_ROOT" \
            --accept-licenses \
            --accept-obligations \
            --default-answer \
            --confirm-command \
            install qt.qt6.6120.clang_64

          hdiutil detach "$RUNNER_TEMP/QtInstaller" -quiet

      - name: Install Qt (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-0
          set -euo pipefail
          test -n "$QT_INSTALLER_JWT_TOKEN"

          curl -fL \
            https://download.qt.io/official_releases/online_installers/qt-online-installer-linux-x64-online.run \
            -o "$RUNNER_TEMP/qt-installer.run"
          chmod +x "$RUNNER_TEMP/qt-installer.run"

          "$RUNNER_TEMP/qt-installer.run" \
            --root "$QT_ROOT" \
            --accept-licenses \
            --accept-obligations \
            --default-answer \
            --confirm-command \
            install qt.qt6.6120.linux_gcc_64

      - name: Verify Qt installation
        shell: bash
        run: |
          set -euxo pipefail
          test -d "$QT_DIR"
          ls "$QT_DIR"

      - name: Download QtJambi deployment tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools qt-bundle dist

          base="https://repo.maven.apache.org/maven2/io/qtjambi"
          v="$QTJAMBI_VERSION"
          p="${{ matrix.platform }}"

          curl -fLsS "$base/qtjambi/$v/qtjambi-$v.jar" \
            -o tools/qtjambi.jar

          curl -fLsS "$base/qtjambi-native-$p/$v/qtjambi-native-$p-$v.jar" \
            -o tools/qtjambi-native.jar

          curl -fLsS "$base/qtjambi-deployer/$v/qtjambi-deployer-$v.jar" \
            -o tools/deployer.jar

          curl -fLsS "$base/qtjambi-deployer-native-$p/$v/qtjambi-deployer-native-$p-$v.jar" \
            -o tools/deployer-native.jar

      - name: Bundle Qt libraries and plugins
        shell: bash
        run: |
          set -euo pipefail

          if [ "$RUNNER_OS" = "Windows" ]; then
            native_path="$QT_DIR/bin"
            cp_sep=';'
          else
            native_path="$QT_DIR/lib"
            cp_sep=':'
          fi

          cp="tools/qtjambi.jar${cp_sep}tools/qtjambi-native.jar${cp_sep}tools/deployer.jar${cp_sep}tools/deployer-native.jar"

          java "-Djava.library.path=$native_path" \
            -cp "$cp" \
            io.qt.qtjambi.deployer.Main qt \
            --platform="${{ matrix.platform }}" \
            --qtdir="$QT_DIR" \
            --target-directory=qt-bundle

          find qt-bundle -maxdepth 1 -type f -name '*.jar' -print
          test -n "$(find qt-bundle -maxdepth 1 -type f -name '*.jar' -print -quit)"

      - name: Package Windows application
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          out="dist/CrazyWaffleMidi"
          mkdir -p "$out/bin" "$out/lib" "$out/jre"

          cp app/build/libs/app-all.jar "$out/lib/"
          cp tools/qtjambi.jar "$out/lib/"
          cp tools/qtjambi-native.jar "$out/lib/"
          cp qt-bundle/*.jar "$out/lib/"

          # The QtJambi deployer creates the native launcher.
          cp="tools/qtjambi.jar;tools/qtjambi-native.jar;tools/deployer.jar;tools/deployer-native.jar"

          java "-Djava.library.path=$QT_DIR/bin" \
            -cp "$cp" \
            io.qt.qtjambi.deployer.Main app \
            --application=CrazyWaffleMidi \
            '--class-path=../lib/*' \
            --library-path=. \
            --jvm-path=../jre \
            --main-class=com.cwm.CrazyWaffleMidi.Main \
            --dir="$out/bin"

          cp -R "$JAVA_HOME"/. "$out/jre/"
          7z a dist/CrazyWaffleMidi-windows-x64.zip "$out/*"

      - name: Package macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          cp="tools/qtjambi.jar:tools/qtjambi-native.jar:tools/deployer.jar:tools/deployer-native.jar"

          java "-Djava.library.path=$QT_DIR/lib" \
            -cp "$cp" \
            io.qt.qtjambi.deployer.Main app \
            --application=CrazyWaffleMidi \
            '--class-path=CrazyWaffleMidi.app/Contents/lib/*' \
            --library-path=CrazyWaffleMidi.app/Contents/Frameworks \
            --jvm-path=CrazyWaffleMidi.app/Contents/jre \
            --main-class=com.cwm.CrazyWaffleMidi.Main \
            --dir=dist \
            -- -XstartOnFirstThread

          app="dist/CrazyWaffleMidi.app"
          contents="$app/Contents"
          mkdir -p "$contents/lib" "$contents/jre"

          cp app/build/libs/app-all.jar "$contents/lib/"
          cp tools/qtjambi.jar "$contents/lib/"
          cp tools/qtjambi-native.jar "$contents/lib/"
          cp qt-bundle/*.jar "$contents/lib/"
          cp -R "$JAVA_HOME"/. "$contents/jre/"

          hdiutil create \
            -volname CrazyWaffleMidi \
            -srcfolder "$app" \
            -ov -format UDZO \
            dist/CrazyWaffleMidi-macos.dmg

      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          out="dist/CrazyWaffleMidi"
          mkdir -p "$out/lib" "$out/jre"

          cp app/build/libs/app-all.jar "$out/lib/"
          cp tools/qtjambi.jar "$out/lib/"
          cp tools/qtjambi-native.jar "$out/lib/"
          cp qt-bundle/*.jar "$out/lib/"

          cp="tools/qtjambi.jar:tools/qtjambi-native.jar:tools/deployer.jar:tools/deployer-native.jar"

          java "-Djava.library.path=$QT_DIR/lib" \
            -cp "$cp" \
            io.qt.qtjambi.deployer.Main app \
            --application=CrazyWaffleMidi \
            --class-path=lib/* \
            --library-path=lib \
            --jvm-path=jre \
            --main-class=com.cwm.CrazyWaffleMidi.Main \
            --dir="$out"

          cp -R "$JAVA_HOME"/. "$out/jre/"

          mkdir -p AppDir
          cp -a "$out"/. AppDir/

          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          exec "$HERE/CrazyWaffleMidi" "$@"
          EOF
          chmod +x AppDir/AppRun

          cat > AppDir/CrazyWaffleMidi.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=CrazyWaffleMidi
          Exec=AppRun
          Categories=AudioVideo;
          Terminal=false
          EOF

          curl -fL \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            -o "$RUNNER_TEMP/appimagetool.AppImage"
          chmod +x "$RUNNER_TEMP/appimagetool.AppImage"

          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 \
            "$RUNNER_TEMP/appimagetool.AppImage" \
            AppDir dist/CrazyWaffleMidi-linux-x64.AppImage

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: CrazyWaffleMidi ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: release-assets/*
