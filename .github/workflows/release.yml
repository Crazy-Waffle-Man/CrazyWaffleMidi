name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: true
        default: 'v'
        type: string
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
          - os: ubuntu-latest
            name: Linux
    runs-on: ${{ matrix.os }}
    name: Package for ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Gradle build task
        run: | 
          ./gradlew build
      - name: Create QtJambi bundled zipfile (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir tmp
          cp ./app/build/jmods/app.jar                                      tmp/app.jar
          cp ./app/build/jmods/qtjambi-6.12.0.jar                           tmp/qtjambi-6.12.0.jar
          cp ./app/build/jmods/qtjambi-deployer-6.12.0.jar                  tmp/qtjambi-deployer-6.12.0.jar

          cp ./app/build/jmods/qtjambi-native-linux-x64-6.12.0.jar          tmp/qtjambi-native-linux-x64-6.12.0.jar
          cp ./app/build/jmods/qtjambi-deployer-native-linux-x64-6.12.0.jar tmp/qtjambi-deployer-native-linux-x64-6.12.0.jar

          java \
          -p tmp/qtjambi-6.12.0.jar:tmp/qtjambi-deployer-6.12.0.jar \
          -m qtjambi.deployer app \
          --application=CrazyWaffleMidi \
          --class-path=lib/app.jar:lib/qtjambi-6.12.0.jar:lib/qtjambi-native-linux-x64-6.12.0.jar \
          --library-path=lib \
          --jvm-path=jre \
          --main-class=com.cwm.CrazyWaffleMidi.Main \
          --dir=output
          
          rm tmp/*deployer*
          cp -r tmp output/lib
          cp /usr/lib/libQt6Core.so output/lib/libQt6Core.so
          cp /usr/lib/libQt6Gui.so output/lib/libQt6Gui.so
          cp /usr/lib/libQt6Widgets.so output/lib/libQt6Widgets.so

          # Bundle JRE in output/jre/

          jlink --module-path "$(dirname "$(dirname "$(readlink -f "$(which jlink)")")")/jmods" --add-modules ALL-MODULE-PATH \
          --output output/jre --strip-debug --no-man-pages --no-header-files
          mv output/ CrazyWaffleMidi-linux
          zip -r CrazyWaffleMidi-linux.zip CrazyWaffleMidi-linux/
          rm tmp CrazyWaffleMidi-linux -rf
      - name: Create QtJambi bundled zipfle (MacOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if ! command -v macdeployqt >/dev/null 2>&1; then
            echo "macdeployqt not found; installing Qt"
            if ! command -v brew >/dev/null 2>&1; then
              echo "Brew not installed"
              exit 1
            fi
            brew install qt
          fi
          if command -v macdeployqt >/dev/null 2>&1; then
            MACDEPLOYQT="$(command -v macdeployqt)"
          elif command -v brew >/dev/null 2>&1 && \
            [ -x "$(brew --prefix qt)/bin/macdeployqt" ]; then
            MACDEPLOYQT="$(brew --prefix qt)/bin/macdeployqt"
          else
            echo "Error: macdeployqt still not found after installation."
            exit 1
          fi

          echo "Using macdeployqt $MACDEPLOYQT"

          mkdir tmp
          cp ./app/build/jmods/app.jar                                      tmp/app.jar
          cp ./app/build/jmods/qtjambi-6.12.0.jar                           tmp/qtjambi-6.12.0.jar
          cp ./app/build/jmods/qtjambi-deployer-6.12.0.jar                  tmp/qtjambi-deployer-6.12.0.jar

          cp ./app/build/jmods/qtjambi-native-macos-6.12.0.jar          tmp/qtjambi-native-macos-6.12.0.jar
          cp ./app/build/jmods/qtjambi-deployer-native-macos-6.12.0.jar tmp/qtjambi-deployer-native-macos-6.12.0.jar

          java \
          -p tmp/qtjambi-6.12.0.jar:tmp/qtjambi-deployer-6.12.0.jar \
          -m qtjambi.deployer app \
          --application=CrazyWaffleMidi \
          --class-path=CrazyWaffleMidi.app/Contents/lib/app.jar:CrazyWaffleMidi.app/Contents/lib/qtjambi-6.12.0.jar:CrazyWaffleMidi.app/Contents/lib/qtjambi-native-macos-6.12.0.jar \
          --library-path=CrazyWaffleMidi.app/Contents/Frameworks \
          --jvm-path=CrazyWaffleMidi.app/Contents/jre \
          --main-class=com.cwm.CrazyWaffleMidi.Main \
          --dir=output

          rm tmp/*deployer*

          jlink --module-path "$(/usr/libexec/java_home -v 21)/jmods" --add-modules ALL-MODULE-PATH \
          --output output/CrazyWaffleMidi.app/Contents/jre --strip-debug --no-man-pages --no-header-files

          cp tmp/app.jar                         output/CrazyWaffleMidi.app/Contents/lib/app.jar
          cp tmp/qtjambi-6.12.0.jar              output/CrazyWaffleMidi.app/Contents/lib/qtjambi-6.12.0.jar
          cp tmp/qtjambi-native-macos-6.12.0.jar output/CrazyWaffleMidi.app/Contents/lib/qtjambi-native-macos-6.12.0.jar

          "$MACDEPLOYQT" output/CrazyWaffleMidi.app -verbose=2

          ditto -c -k --sequesterRsrc --keepParent output/CrazyWaffleMidi.app CrazyWaffleMidi-macos.zip
      - name: Create QtJambi bundled zipfle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # TODO: Check for/install windeployqt

          New-Item -ItemType Directory -Path tmp -Force | Out-Null

          Copy-Item ./app/build/jmods/app.jar                                      tmp/app.jar
          Copy-Item ./app/build/jmods/qtjambi-6.12.0.jar                           tmp/qtjambi-6.12.0.jar
          Copy-Item ./app/build/jmods/qtjambi-deployer-6.12.0.jar                  tmp/qtjambi-deployer-6.12.0.jar

          Copy-Item ./app/build/jmods/qtjambi-native-windows-x64-6.12.0.jar          tmp/qtjambi-native-windows-x64-6.12.0.jar
          Copy-Item ./app/build/jmods/qtjambi-deployer-native-windows-x64-6.12.0.jar tmp/qtjambi-deployer-native-windows-x64-6.12.0.jar

          java `
          -p tmp/qtjambi-6.12.0.jar:tmp/qtjambi-deployer-6.12.0.jar `
          -m qtjambi.deployer app `
          --application=CrazyWaffleMidi `
          --class-path=../lib/app.jar:../lib/qtjambi-6.12.0.jar:../lib/qtjambi-native-windows-x64-6.12.0.jar `
          --library-path=. `
          --jvm-path=../jre `
          --main-class=com.cwm.CrazyWaffleMidi.Main `
          --dir=output

          Get-ChildItem tmp/*deployer* | Remove-Item -Force

          Copy-Item tmp output/lib -Recurse -Force

          # Copy-Item /usr/lib/libQt6Core.so    output/lib/libQt6Core.so
          # Copy-Item /usr/lib/libQt6Gui.so     output/lib/libQt6Gui.so
          # Copy-Item /usr/lib/libQt6Widgets.so output/lib/libQt6Widgets.so

          $javaHome = Split-Path (Split-Path (Get-Command jlink).Source -Parent) -Parent

          jlink `
              --module-path "$javaHome/jmods" `
              --add-modules ALL-MODULE-PATH `
              --output output/jre `
              --strip-debug `
              --no-man-pages `
              --no-header-files

          Move-Item output CrazyWaffleMidi-windows

          Compress-Archive `
              -Path CrazyWaffleMidi-windows `
              -DestinationPath CrazyWaffleMidi-windows.zip `
              -Force

          Remove-Item tmp, CrazyWaffleMidi-windows -Recurse -Force