# I had a LLM generate this one because I'm not gonna learn all the documentation behind this 
# when my .jar is perfectly fine if you have Java installed.
# This file is not my job.

name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. v1.0.0"
        required: true
        type: string
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
            qt_arch: msvc2022_64
            artifact: windows-release
          - os: macos-14
            platform: macos
            qt_arch: macos
            artifact: macos-release
          - os: ubuntu-22.04
            platform: linux-x64
            qt_arch: gcc_64
            artifact: linux-release

    runs-on: ${{ matrix.os }}

    env:
      QTJAMBI_VERSION: "6.12.0"
      QTJAMBI_PLATFORM: ${{ matrix.platform }}
      QT_ROOT: ${{ github.workspace }}/Qt
      QT_DIR: ${{ github.workspace }}/Qt/6.12.0/${{ matrix.qt_arch }}
      QT_INSTALLER_JWT_TOKEN: ${{ secrets.QT_INSTALLER_JWT_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build fat JAR
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x ./gradlew
          ./gradlew :app:clean :app:shadowJar
          test -s app/build/libs/app-all.jar

      # Qt's official installer replaces aqtinstall here because
      # aqtinstall currently fails to parse the Qt 6.12.0 metadata.
      # Configure the QT_INSTALLER_JWT_TOKEN repository secret first.

      - name: Install Qt SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:QT_INSTALLER_JWT_TOKEN)) {
            throw "Configure the QT_INSTALLER_JWT_TOKEN repository Actions secret."
          }

          $installer = "$env:RUNNER_TEMP\qt-installer.exe"

          Invoke-WebRequest `
            -Uri "https://download.qt.io/official_releases/online_installers/qt-online-installer-windows-x64-online.exe" `
            -OutFile $installer

          & $installer `
            --root "$env:QT_ROOT" `
            --accept-licenses `
            --default-answer `
            --confirm-command `
            install qt.qt6.6120.win64_msvc2022_64

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Install Qt SDK (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          test -n "${QT_INSTALLER_JWT_TOKEN:-}" || {
            echo "Configure the QT_INSTALLER_JWT_TOKEN repository Actions secret."
            exit 1
          }

          curl -fL \
            https://download.qt.io/official_releases/online_installers/qt-online-installer-macOS-universal.dmg \
            -o "$RUNNER_TEMP/qt-installer.dmg"

          mkdir -p "$RUNNER_TEMP/QtInstaller"

          hdiutil attach \
            "$RUNNER_TEMP/qt-installer.dmg" \
            -nobrowse \
            -quiet \
            -mountpoint "$RUNNER_TEMP/QtInstaller"

          trap 'hdiutil detach "$RUNNER_TEMP/QtInstaller" -quiet || true' EXIT

          installer="$(find "$RUNNER_TEMP/QtInstaller" \
            -type f -path '*/Contents/MacOS/*' -perm -111 \
            -print -quit)"

          test -n "$installer"

          "$installer" \
            --root "$QT_ROOT" \
            --accept-licenses \
            --default-answer \
            --confirm-command \
            install qt.qt6.6120.clang_64

      - name: Install Qt SDK (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          test -n "${QT_INSTALLER_JWT_TOKEN:-}" || {
            echo "Configure the QT_INSTALLER_JWT_TOKEN repository Actions secret."
            exit 1
          }

          curl -fL \
            https://download.qt.io/official_releases/online_installers/qt-online-installer-linux-x64-online.run \
            -o "$RUNNER_TEMP/qt-installer.run"

          chmod +x "$RUNNER_TEMP/qt-installer.run"

          "$RUNNER_TEMP/qt-installer.run" \
            --root "$QT_ROOT" \
            --accept-licenses \
            --default-answer \
            --confirm-command \
            install qt.qt6.6120.linux_gcc_64

      - name: Verify Qt SDK
        shell: bash
        run: |
          set -euxo pipefail
          test -d "$QT_DIR"
          ls "$QT_DIR"

      - name: Download QtJambi deployment tools
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p tools dist

          BASE="https://repo.maven.apache.org/maven2/io/qtjambi"
          VERSION="$QTJAMBI_VERSION"
          PLATFORM="$QTJAMBI_PLATFORM"

          download() {
            curl -fLsS "$1" -o "$2"
          }

          download \
            "$BASE/qtjambi/$VERSION/qtjambi-$VERSION.jar" \
            "tools/qtjambi-$VERSION.jar"

          download \
            "$BASE/qtjambi-native-$PLATFORM/$VERSION/qtjambi-native-$PLATFORM-$VERSION.jar" \
            "tools/qtjambi-native-$PLATFORM-$VERSION.jar"

          download \
            "$BASE/qtjambi-deployer/$VERSION/qtjambi-deployer-$VERSION.jar" \
            "tools/qtjambi-deployer-$VERSION.jar"

          download \
            "$BASE/qtjambi-deployer-native-$PLATFORM/$VERSION/qtjambi-deployer-native-$PLATFORM-$VERSION.jar" \
            "tools/qtjambi-deployer-native-$PLATFORM-$VERSION.jar"

      # The native QtJambi JAR is deliberately included in the
      # deployer classpath. Omitting it caused the macOS failure.

      - name: Create Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:QTJAMBI_VERSION
          $platform = $env:QTJAMBI_PLATFORM
          $out = "dist/CrazyWaffleMidi"

          New-Item -ItemType Directory -Force -Path `
            "$out/bin", "$out/lib", "$out/jre" | Out-Null

          $cp = "tools/qtjambi-$version.jar;" +
                "tools/qtjambi-native-$platform-$version.jar;" +
                "tools/qtjambi-deployer-$version.jar;" +
                "tools/qtjambi-deployer-native-$platform-$version.jar"

          & java "-Djava.library.path=$env:QT_DIR\bin" `
            -cp $cp `
            io.qt.qtjambi.deployer.Main app `
            --application=CrazyWaffleMidi `
            '--class-path=../lib/*' `
            --library-path=. `
            --jvm-path=../jre `
            --main-class=com.cwm.CrazyWaffleMidi.Main `
            --dir=$out

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          Copy-Item "$env:QT_DIR\bin\*.dll" "$out\bin\" -Force
          Copy-Item "$env:QT_DIR\plugins" "$out\" -Recurse -Force

          Copy-Item app/build/libs/app-all.jar "$out\lib\"
          Copy-Item "tools/qtjambi-$version.jar" "$out\lib\"
          Copy-Item "tools/qtjambi-native-$platform-$version.jar" "$out\lib\"

          Copy-Item "$env:JAVA_HOME\*" "$out\jre\" -Recurse -Force

          Compress-Archive `
            -Path "$out\*" `
            -DestinationPath dist/CrazyWaffleMidi-windows-x64.zip `
            -Force

      - name: Create macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$QTJAMBI_VERSION"
          PLATFORM="$QTJAMBI_PLATFORM"

          CP="tools/qtjambi-$VERSION.jar"
          CP="$CP:tools/qtjambi-native-$PLATFORM-$VERSION.jar"
          CP="$CP:tools/qtjambi-deployer-$VERSION.jar"
          CP="$CP:tools/qtjambi-deployer-native-$PLATFORM-$VERSION.jar"

          java "-Djava.library.path=$QT_DIR/lib" \
            -cp "$CP" \
            io.qt.qtjambi.deployer.Main app \
            --application=CrazyWaffleMidi \
            '--class-path=CrazyWaffleMidi.app/Contents/lib/*' \
            --library-path=CrazyWaffleMidi.app/Contents/Frameworks \
            --jvm-path=CrazyWaffleMidi.app/Contents/jre \
            --main-class=com.cwm.CrazyWaffleMidi.Main \
            --dir=dist \
            -- -XstartOnFirstThread

          APP="dist/CrazyWaffleMidi.app"
          CONTENTS="$APP/Contents"

          mkdir -p \
            "$CONTENTS/lib" \
            "$CONTENTS/jre" \
            "$CONTENTS/Frameworks"

          cp app/build/libs/app-all.jar "$CONTENTS/lib/"
          cp "tools/qtjambi-$VERSION.jar" "$CONTENTS/lib/"
          cp "tools/qtjambi-native-$PLATFORM-$VERSION.jar" "$CONTENTS/lib/"

          cp -R "$JAVA_HOME"/. "$CONTENTS/jre/"

          for item in "$QT_DIR"/lib/*.framework "$QT_DIR"/lib/*.dylib; do
            if [ -e "$item" ]; then
              cp -R "$item" "$CONTENTS/Frameworks/"
            fi
          done

          cp -R "$QT_DIR/plugins" "$CONTENTS/"

          hdiutil create \
            -volname CrazyWaffleMidi \
            -srcfolder "$APP" \
            -ov \
            -format UDZO \
            dist/CrazyWaffleMidi-macos.dmg

      - name: Create Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$QTJAMBI_VERSION"
          PLATFORM="$QTJAMBI_PLATFORM"
          OUT="dist/CrazyWaffleMidi"

          CP="tools/qtjambi-$VERSION.jar"
          CP="$CP:tools/qtjambi-native-$PLATFORM-$VERSION.jar"
          CP="$CP:tools/qtjambi-deployer-$VERSION.jar"
          CP="$CP:tools/qtjambi-deployer-native-$PLATFORM-$VERSION.jar"

          mkdir -p "$OUT"

          java "-Djava.library.path=$QT_DIR/lib" \
            -cp "$CP" \
            io.qt.qtjambi.deployer.Main app \
            --application=CrazyWaffleMidi \
            '--class-path=lib/*' \
            --library-path=lib \
            --jvm-path=jre \
            --main-class=com.cwm.CrazyWaffleMidi.Main \
            --dir="$OUT"

name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.0)"
        required: true
        type: string
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
          - os: macos-14
            platform: macos
          - os: ubuntu-22.04
            platform: linux-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build application
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew build
          ls -lah app/build/libs/
          test -f app/build/libs/app-all.jar

      - name: Download QtJambi deployment tools
        shell: bash
        env:
          VERSION: "6.12.0"
        run: |
          set -euo pipefail

          mkdir -p tools dist
          BASE="https://repo1.maven.org/maven2/io/qtjambi"

          curl -fsSL "$BASE/qtjambi/$VERSION/qtjambi-$VERSION.jar" \
            -o tools/qtjambi.jar

          curl -fsSL "$BASE/qtjambi-deployer/$VERSION/qtjambi-deployer-$VERSION.jar" \
            -o tools/deployer.jar

          case "${{ matrix.platform }}" in
            windows-x64) NATIVE="windows-x64" ;;
            linux-x64)   NATIVE="linux-x64" ;;
            macos)       NATIVE="macos" ;;
          esac

          curl -fsSL \
            "$BASE/qtjambi-deployer-native-$NATIVE/$VERSION/qtjambi-deployer-native-$NATIVE-$VERSION.jar" \
            -o tools/deployer-native.jar

          curl -fsSL \
            "$BASE/qtjambi-native-$NATIVE/$VERSION/qtjambi-native-$NATIVE-$VERSION.jar" \
            -o tools/qtjambi-native.jar

      # QtJambi requires the matching Qt native libraries.

          mkdir -p "$OUT/lib" "$OUT/jre"

          cp app/build/libs/app-all.jar "$OUT/lib/"
          cp "tools/qtjambi-$VERSION.jar" "$OUT/lib/"
          cp "tools/qtjambi-native-$PLATFORM-$VERSION.jar" "$OUT/lib/"

          cp -R "$JAVA_HOME"/. "$OUT/jre/"

          cp -a "$QT_DIR"/lib/*.so* "$OUT/lib/"
          cp -R "$QT_DIR/plugins" "$OUT/"

          mkdir -p AppDir
          cp -a "$OUT"/. AppDir/

          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          exec "$HERE/CrazyWaffleMidi" "$@"
          EOF
          chmod +x AppDir/AppRun

          cat > AppDir/CrazyWaffleMidi.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=CrazyWaffleMidi
          Exec=AppRun
          Categories=AudioVideo;
          Terminal=false
          EOF

          curl -fL \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            -o "$RUNNER_TEMP/appimagetool.AppImage"

          chmod +x "$RUNNER_TEMP/appimagetool.AppImage"

          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 \
            "$RUNNER_TEMP/appimagetool.AppImage" \
            AppDir dist/CrazyWaffleMidi-linux-x64.AppImage

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/*.zip
          if-no-files-found: error

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: dist/*.dmg
          if-no-files-found: error

      - name: Upload Linux artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: dist/*.AppImage
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all platform builds
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: CrazyWaffleMidi ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: release-assets/*
