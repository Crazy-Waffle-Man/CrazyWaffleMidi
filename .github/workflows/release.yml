name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
            qt_arch: win64_msvc2019_64
          - os: macos-14
            platform: macos
            qt_arch: clang_64
          - os: ubuntu-22.04
            platform: linux-x64
            qt_arch: gcc_64

    env:
      APP_NAME: CrazyWaffleMidi
      QT_VERSION: "6.12.0"
      QT_ROOT: ${{ github.workspace }}/Qt
      QT_DIR: ${{ github.workspace }}/Qt/6.12.0/${{ matrix.qt_arch }}
      QTJAMBI_VERSION: "6.12.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.12.0"
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Verify Qt installation
        shell: bash
        run: |
          set -euxo pipefail
          test -d "$QT_DIR"
          ls "$QT_DIR"

      - name: Install Linux Qt runtime deps
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1

      - name: Build fat JAR
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x ./gradlew
          ./gradlew :app:clean :app:shadowJar
          test -s app/build/libs/app-all.jar

      - name: Create bundled Java runtime
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          jlink \
            --add-modules java.base,java.desktop,java.logging,java.management,java.naming,java.net.http,java.prefs,java.sql,java.xml,jdk.unsupported \
            --strip-debug \
            --no-header-files \
            --no-man-pages \
            --compress=2 \
            --output dist/jre
          test -x dist/jre/bin/java

      - name: Download QtJambi deployment tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools qt-bundle

          base="https://repo.maven.apache.org/maven2/io/qtjambi"
          v="$QTJAMBI_VERSION"
          p="${{ matrix.platform }}"

          curl -fLsS "$base/qtjambi/$v/qtjambi-$v.jar" -o tools/qtjambi.jar
          curl -fLsS "$base/qtjambi-native-$p/$v/qtjambi-native-$p-$v.jar" -o tools/qtjambi-native.jar
          curl -fLsS "$base/qtjambi-deployer/$v/qtjambi-deployer-$v.jar" -o tools/deployer.jar
          curl -fLsS "$base/qtjambi-deployer-native-$p/$v/qtjambi-deployer-native-$p-$v.jar" -o tools/deployer-native.jar

      - name: Bundle Qt libraries and plugins
        shell: bash
        run: |
          set -euo pipefail

          if [ "$RUNNER_OS" = "Windows" ]; then
            native_path="$QT_DIR/bin"
            cp_sep=';'
          else
            native_path="$QT_DIR/lib"
            cp_sep=':'
          fi

          cp="tools/qtjambi.jar${cp_sep}tools/qtjambi-native.jar${cp_sep}tools/deployer.jar${cp_sep}tools/deployer-native.jar"

          java "-Djava.library.path=$native_path" \
            -cp "$cp" \
            io.qt.qtjambi.deployer.Main qt \
            --platform="${{ matrix.platform }}" \
            --qtdir="$QT_DIR" \
            --target-directory=qt-bundle

          find qt-bundle -maxdepth 1 -type f -name '*.jar' -print
          test -n "$(find qt-bundle -maxdepth 1 -type f -name '*.jar' -print -quit)"

      - name: Package Windows application
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          out="dist/CrazyWaffleMidi"
          mkdir -p "$out/bin" "$out/lib"

          cp app/build/libs/app-all.jar "$out/lib/"
          cp tools/qtjambi.jar "$out/lib/"
          cp tools/qtjambi-native.jar "$out/lib/"
          cp qt-bundle/*.jar "$out/lib/"
          cp -R dist/jre/. "$out/jre/"

          cp="tools/qtjambi.jar;tools/qtjambi-native.jar;tools/deployer.jar;tools/deployer-native.jar"

          java "-Djava.library.path=$QT_DIR/bin" \
            -cp "$cp" \
            io.qt.qtjambi.deployer.Main app \
            --application=CrazyWaffleMidi \
            '--class-path=../lib/*' \
            --library-path=. \
            --jvm-path=../jre \
            --main-class=com.cwm.CrazyWaffleMidi.Main \
            --dir="$out/bin"

          7z a dist/CrazyWaffleMidi-windows-x64.zip "$out/*"

      - name: Package macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          app="dist/CrazyWaffleMidi.app"
          contents="$app/Contents"
          mkdir -p "$contents/lib" "$contents/jre"

          cp app/build/libs/app-all.jar "$contents/lib/"
          cp tools/qtjambi.jar "$contents/lib/"
          cp tools/qtjambi-native.jar "$contents/lib/"
          cp qt-bundle/*.jar "$contents/lib/"
          cp -R dist/jre/. "$contents/jre/"

          cp="tools/qtjambi.jar:tools/qtjambi-native.jar:tools/deployer.jar:tools/deployer-native.jar"

          java "-Djava.library.path=$QT_DIR/lib" \
            -cp "$cp" \
            io.qt.qtjambi.deployer.Main app \
            --application=CrazyWaffleMidi \
            '--class-path=CrazyWaffleMidi.app/Contents/lib/*' \
            --library-path=CrazyWaffleMidi.app/Contents/Frameworks \
            --jvm-path=CrazyWaffleMidi.app/Contents/jre \
            --main-class=com.cwm.CrazyWaffleMidi.Main \
            --dir=dist \
            -- -XstartOnFirstThread

          hdiutil create \
            -volname CrazyWaffleMidi \
            -srcfolder "$app" \
            -ov -format UDZO \
            dist/CrazyWaffleMidi-macos.dmg

      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          out="dist/CrazyWaffleMidi"
          mkdir -p "$out/lib" "$out/jre"

          cp app/build/libs/app-all.jar "$out/lib/"
          cp tools/qtjambi.jar "$out/lib/"
          cp tools/qtjambi-native.jar "$out/lib/"
          cp qt-bundle/*.jar "$out/lib/"
          cp -R dist/jre/. "$out/jre/"

          cp="tools/qtjambi.jar:tools/qtjambi-native.jar:tools/deployer.jar:tools/deployer-native.jar"

          java "-Djava.library.path=$QT_DIR/lib" \
            -cp "$cp" \
            io.qt.qtjambi.deployer.Main app \
            --application=CrazyWaffleMidi \
            --class-path=lib/* \
            --library-path=lib \
            --jvm-path=jre \
            --main-class=com.cwm.CrazyWaffleMidi.Main \
            --dir="$out"

          mkdir -p AppDir
          cp -a "$out"/. AppDir/

          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          exec "$HERE/CrazyWaffleMidi" "$@"
          EOF
          chmod +x AppDir/AppRun

          cat > AppDir/CrazyWaffleMidi.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=CrazyWaffleMidi
          Exec=AppRun
          Categories=AudioVideo;
          Terminal=false
          EOF

          curl -fL \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            -o "$RUNNER_TEMP/appimagetool.AppImage"
          chmod +x "$RUNNER_TEMP/appimagetool.AppImage"

          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 \
            "$RUNNER_TEMP/appimagetool.AppImage" \
            AppDir dist/CrazyWaffleMidi-linux-x64.AppImage

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: CrazyWaffleMidi ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: release-assets/*
