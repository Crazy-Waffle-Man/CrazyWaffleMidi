name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: true
        default: 'v'
        type: string
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
          - os: ubuntu-latest
            name: Linux
    runs-on: ${{ matrix.os }}
    name: Package for ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build and upload app image (Linux)
        if: runner.os == 'Linux'
        run: ./gradlew :app:jpackage
      - name: Build and upload app image (MacOS)
        if: runner.os == 'macOS'
        run: ./gradlew :app:jpackage
      - name: Build and upload app image (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew :app:jpackage
      - name: Upload app image
        uses: actions/upload-artifact@v4
        with:
          name: CrazyWaffleMidi-linux
          path: app/build/dist/