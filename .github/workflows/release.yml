# I had a LLM generate this one because I'm not gonna learn all the documentation behind this 
# when my .jar is perfectly fine if you have Java installed.
# This file is not my job.
name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.0)"
        required: true
        type: string
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            asset: windows
          - os: macos-14
            platform: macos
            asset: macos
          - os: ubuntu-22.04
            platform: linux-x64
            asset: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build JAR
        run: mvn --batch-mode clean package

      # Each script must invoke the QtJambi deployer,
      # bundle the required native libraries and JRE,
      # and create a distributable archive in dist/.
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1

      - name: Package macOS
        if: runner.os == 'macOS'
        run: bash scripts/package-macos.sh

      - name: Package Linux
        if: runner.os == 'Linux'
        run: bash scripts/package-linux.sh

      - name: Upload distributable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all distributables
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create Release and upload files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
