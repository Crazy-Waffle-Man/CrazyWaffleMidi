# I had a LLM generate this one because I'm not gonna learn all the documentation behind this 
# when my .jar is perfectly fine if you have Java installed.
# This file is not my job.

name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.0)"
        required: true
        type: string
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
          - os: macos-14
            platform: macos
          - os: ubuntu-22.04
            platform: linux-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build application
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :app:build
          ls -lah app/build/libs/
          test -f app/build/libs/app-all.jar

      - name: Download QtJambi deployment tools
        shell: bash
        env:
          VERSION: "6.12.0"
        run: |
          set -euo pipefail

          mkdir -p tools dist
          BASE="https://repo1.maven.org/maven2/io/qtjambi"

          curl -fsSL "$BASE/qtjambi/$VERSION/qtjambi-$VERSION.jar" \
            -o tools/qtjambi.jar

          curl -fsSL "$BASE/qtjambi-deployer/$VERSION/qtjambi-deployer-$VERSION.jar" \
            -o tools/deployer.jar

          case "${{ matrix.platform }}" in
            windows-x64) NATIVE="windows-x64" ;;
            linux-x64)   NATIVE="linux-x64" ;;
            macos)       NATIVE="macos" ;;
          esac

          curl -fsSL \
            "$BASE/qtjambi-deployer-native-$NATIVE/$VERSION/qtjambi-deployer-native-$NATIVE-$VERSION.jar" \
            -o tools/deployer-native.jar

          curl -fsSL \
            "$BASE/qtjambi-native-$NATIVE/$VERSION/qtjambi-native-$NATIVE-$VERSION.jar" \
            -o tools/qtjambi-native.jar

      # QtJambi requires the matching Qt native libraries.
      # This installs Qt 6.12.0 on the current platform.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.12.0"
          host: ${{ runner.os == 'Windows' && 'windows' || runner.os == 'macOS' && 'mac' || 'linux' }}
          target: desktop
          arch: ${{ runner.os == 'Windows' && 'win64_msvc2022_64' || runner.os == 'macOS' && 'clang_64' || 'gcc_64' }}
          cache: true

      - name: Bundle Qt libraries
        shell: bash
        run: |
          set -euo pipefail

          case "${{ matrix.platform }}" in
            windows-x64)
              QT_LIB="$QT_ROOT_DIR/bin"
              ;;
            macos)
              QT_LIB="$QT_ROOT_DIR/lib"
              ;;
            linux-x64)
              QT_LIB="$QT_ROOT_DIR/lib"
              ;;
          esac

          mkdir -p qt-bundle

          java -Djava.library.path="$QT_LIB" \
            -cp "tools/qtjambi.jar:tools/deployer.jar:tools/deployer-native.jar" \
            io.qt.qtjambi.deployer.Main qt \
            --platform="${{ matrix.platform }}" \
            --qtdir="$QT_ROOT_DIR" \
            --target-directory=qt-bundle

      - name: Prepare QtJambi application bundle
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p package/lib package/jre

          cp app/build/libs/app-all.jar package/lib/app-all.jar
          cp tools/qtjambi-native.jar package/lib/

          # Include the generated Qt library bundles.
          cp qt-bundle/*.jar package/lib/

          # Include the Java runtime so users don't need to install Java.
          cp -R "$JAVA_HOME"/. package/jre/

      - name: Create Windows executable
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p package/bin

          java -Djava.library.path="$QT_ROOT_DIR/bin" \
            -cp "tools/qtjambi.jar:tools/deployer.jar:tools/deployer-native.jar" \
            io.qt.qtjambi.deployer.Main app \
            --application=CrazyWaffleMidi \
            --class-path='../lib/*' \
            --library-path=. \
            --jvm-path=../jre \
            --main-class=com.cwm.CrazyWaffleMidi.Main \
            --dir=package/bin

          cp -R "$QT_ROOT_DIR/bin"/. package/bin/
          cp -R "$QT_ROOT_DIR/plugins" package/

          7z a dist/CrazyWaffleMidi-windows-x64.zip package

      - name: Create macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          java -Djava.library.path="$QT_ROOT_DIR/lib" \
            -cp "tools/qtjambi.jar:tools/deployer.jar:tools/deployer-native.jar" \
            io.qt.qtjambi.deployer.Main app \
            --application=CrazyWaffleMidi \
            --class-path='Contents/lib/*' \
            --library-path=Contents/Frameworks \
            --jvm-path=Contents/jre \
            --main-class=com.cwm.CrazyWaffleMidi.Main \
            --dir=dist

          ditto -c -k --sequesterRsrc --keepParent \
            dist/CrazyWaffleMidi.app \
            dist/CrazyWaffleMidi-macos.zip

      - name: Create Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          java -Djava.library.path="$QT_ROOT_DIR/lib" \
            -cp "tools/qtjambi.jar:tools/deployer.jar:tools/deployer-native.jar" \
            io.qt.qtjambi.deployer.Main app \
            --application=CrazyWaffleMidi \
            --class-path='lib/*' \
            --library-path=lib \
            --jvm-path=jre \
            --main-class=com.cwm.CrazyWaffleMidi.Main \
            --dir=dist/CrazyWaffleMidi

          mkdir -p AppDir
          cp -R dist/CrazyWaffleMidi/. AppDir/

          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          exec "$HERE/CrazyWaffleMidi" "$@"
          EOF
          chmod +x AppDir/AppRun

          cat > AppDir/CrazyWaffleMidi.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=CrazyWaffleMidi
          Exec=AppRun
          Categories=AudioVideo;
          Terminal=false
          EOF

          curl -fsSL \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage \
            -o appimagetool.AppImage

          chmod +x appimagetool.AppImage

          ARCH=x86_64 ./appimagetool.AppImage \
            AppDir dist/CrazyWaffleMidi-linux-x64.AppImage

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all builds
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: CrazyWaffleMidi ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: release-assets/*
